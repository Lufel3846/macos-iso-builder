name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check script syntax
        run: bash -n mkmaciso

      - name: Run ShellCheck
        run: shellcheck --severity=warning mkmaciso

      - name: Install bats
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bats

      - name: Run unit tests
        run: bats tests
